ire possible à 50 %. Chaque profil a des avantages et des inconvénients chiffrés (Bureau › Carrière). Il influence aussi les offres d'emploi.`],[`Plan du propriétaire`,`Sous 40 % de confiance, le propriétaire exige un plan (faire les séries, ou un nombre de points). Respecté : confiance +12. Raté avec une confiance très basse : congédiement. Les deux premières saisons et la période de grâce d'un nouveau poste protègent le DG.`],[`Offres d'emploi`,`Congédié, sollicité après une grande saison, ou en sondant le marché l'été : 2 à 4 clubs proposent un poste (aspirant, dans la course, reconstruction, remise en ordre) avec attentes et contrat. Accepter continue la même partie ; votre parcours par club est conservé.`],[`Chimie et moral`,`Équipe › Vestiaire : activités d'équipe (avec délais), capitaine et adjoints (leadership), entraînements (repos/normal/intense), mentorat, promesses de temps de jeu, psychologue sportive, conflits à régler. Garder les mêmes trios fait monter la chimie chaque semaine.`],[`Installations`,`Aréna › Installations : 20 investissements (aréna, partisans, performance, hockey, club-école), deux chantiers à la fois, avec effet et entretien annuels affichés.`],[`Nouvel aréna`,`Aréna › Nouvel aréna : capacité, loges, sièges privilège, emplacement, design, technologie, restauration, transport, droits de nom et financement. Le devis montre coût, durée, prêt et revenus. Construction sur plus d'une saison, dépassements possibles, grande ouverture.`],[`Stats`,`Ligue › Mes stats : patineurs (PJ, B, A, PTS, +/-, PUN, tirs, %, TG, PTS AN) et gardiens (V-D-DP, MOY, %ARR, BL), triables. Ligue › Meneurs : top 10/25 de la ligue.`],[`Renouvellements`,`Étape d'après le repêchage : chaque joueur dont le contrat est échu apparaît dans Marché › Renouvellements. Renouvelez, négociez, présentez une offre qualifiée ou laissez partir.`],[`JAC`,`Joueur autonome avec compensation (26 ans et moins). Une offre qualifiée lui garantit un an de plus avec l'équipe.`],[`JASC`,`Jou         function hasName() { try { return String(window.name).indexOf("hockey-WN1:") === 0; } catch (e) { return false; } }
        function go(mode) { location.href = location.pathname + "?secours=" + mode + "#/"; }
        setTimeout(function () {
          if (window.__appReady) return;
          var has = !!raw() || hasName();
          var b = "display:block;width:100%;min-height:48px;margin:8px 0;border-radius:10px;font:16px system-ui;cursor:pointer;";
          document.body.innerHTML =
            '<main data-boot-rescue="" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#07101d;color:#f2ede4;font:16px system-ui;text-align:center">' +
            '<h1 style="font:600 24px Georgia,serif">Le démarrage tarde</h1>' +
            '<p style="max-width:360px;color:#aaa">' + (has ? "Votre partie est sur cet appareil. Reprenez-la." : "Aucune partie trouvée rapidement.") + "</p>" +
            '<div style="width:260px">' +
            (has ? '<button id="secours-continuer" style="' + b + 'background:#ff3b4e;color:#fff;border:0">Continuer la partie</button>' : "") +
            '<button id="secours-nouvelle" style="' + b + 'background:#fff;border:1px solid #ccc">Nouvelle partie</button>' +
            (raw() ? '<button id="secours-exporter" style="' + b + 'background:#fff;border:1px solid #ccc">Exporter la sauvegarde</button>' : "") +
            "</div></main>";
          var c = document.getElementById("secours-continuer"); if (c) c.onclick = function () { go("continuer"); };
          document.getElementById("secours-nouvelle").onclick = function () { go("nouvelle"); };
          var x = document.getElementById("secours-exporter");
          if (x) x.onclick = function () {
            var a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([raw()], { type: "application/json" }));
            a.download = "hockey-sauvegarde.json"; document.body.appendChild(a); a.click();
          };
        }, 6000);
      })();
    </script>
  </body>
