 part des capitaux propres du holding, plus votre argent personnel (dividendes reçus, actions vendues). C'est elle qui compte au classement.`},multiple:{term:`Multiple`,def:`Nombre d'années de BAIIA qu'un acheteur paie pour un actif. Un dépanneur se vend environ 1,8 fois son BAIIA annuel ; une plateforme de diffusion, plus de 4 fois.`},cote:{term:`Cote de crédit`,def:`De AAA (excellente) à CCC (risquée). Dépend surtout de la dette par rapport au BAIIA. Une meilleure cote abaisse le taux de vos emprunts.`},marge:{term:`Marge de crédit`,def:`Réserve d'argent à taux variable (taux directeur + 3,5 %). Tirée d'office si la trésorerie passe sous zéro.`},obligation:{term:`Obligation`,def:`Emprunt auprès des investisseurs : intérêts mensuels, capital remboursé d'un coup après 10 ans. Exige 20 M$ de valeur et une cote BBB ou mieux.`},pape:{term:`PAPE`,def:`Premier appel public à l'épargne : le holding (ou une filiale) entre en bourse en vendant de nouvelles actions au public. L'argent va à l'entreprise ; votre part est diluée.`},dilution:{term:`Dilution`,def:`Quand l'entreprise émet de nouvelles actions, votre pourcentage baisse. Sous 50 %, vous perdez la majorité et les activistes s'agitent.`},dividende:{term:`Dividende`,def:`Part du bénéfice net versée chaque mois aux actionnaires. Votre part va à votre fortune personnelle.`},opa:{term:`OPA`,def:`Offre publique d'achat : proposer à tous les actionnaires d'une société cotée de racheter leurs actions avec une prime. Hostile si la direction s'y oppose.`},diligence:{term:`Vérification diligente`,def:`Examen des livres avant un rachat (1 % du prix). Révèle les mauvaises surprises et fait souvent baisser le prix.`},integration:{term:`Intégration`,def:`Période après un rachat où l'actif rend 15 % de moins : systèmes, culture, syndicats. Plus longue pour les gros actifs et en cas de choc de culture.`},synergie:{term:`Synergie`,def:`Gain obtenu parce que deux activités du groupe s'entraident : publicité maison, approvisionnement interne, droits de diffusion, etc.`},filiale:{term:`Filiale`,def:`Société détenue par le holding. Chaque actif appartient à une filiale d'un domaine. Une filiale peut être vendue en bloc ou entrer en bourse.`},holding:{term:`Holding`,def:`Société mère qui détient les filiales. Vous en êtes l'actionnaire principal.`},minoritaires:{term:`Actionnaires minoritaires`,def:`Le public qui détient une partie d'une filiale cotée. Il touche sa part du bénéfice de cette filiale.`},saturation:{term:`Saturation`,def:`Plus vous possédez d'actifs d'un même type, moins chacun rapporte : les clients ne sont pas infinis.`},rampe:{term:`Montée en régime`,def:`Un actif neuf ouvre à 45 % de ses revenus et gagne environ 14 points par mois jusqu'au plein régime.`},taux:{term:`Taux directeur`,def:`Taux fixé par la Banque centrale. Il fait varier le coût de tous vos nouveaux emprunts et de la marge de crédit.`},reputation:{term:`Réputation`,def:`De 0 à 100. Aide à conclure les rachats et les OPA, améliore légèrement les ventes. Les scandales la font chuter.`},impot:{term:`Impôt`,def:`12,2 % sur les premiers 500 000 $ de bénéfice annuel (taux des PME), 26,5 % au-delà.`},flux:{term:`Flux de trésorerie`,def:`D'où vient l'argent et où il va : exploitation (activités), investissement (chantiers, rachats, ventes) et financement (emprunts, actions, dividendes).`},division:{term:`Division`,def:`Regroupement interne d'une filiale (ex. Division postes d'essence). Elle a son propre état des résultats ; une chaîne rachetée devient une division.`},marque:{term:`Marque`,def:`Nom commercial que vous créez et apposez sur vos actifs. Sa notoriété (0 à 100) augmente leurs ventes et parfois leurs marges ; on peut l'offrir sous licence.`},licence:{term:`Licence`,def:`D'autres entreprises paient chaque mois pour utiliser votre marque. Rentable, mais l'image s'use un peu plus vite.`},logistique:{term:`Capacité logistique`,def:`Vos magasins et pharmacies consomment des unités de logistique ; vos centres de distribution en fournissent. Au-delà, les coûts grimpent.`},placement:{term:`Placement privé`,def:`Vente d'actions du holding à des investisseurs privés, avant la bourse. Argent frais sans dette, en échange d'une dilution.`},complement:{term:`Complément de prix`,def:`Partie du prix de vente payée plus tard (ici 12 mois) si l'actif atteint ses cibles. Plus d'argent en tout, mais pas garanti.`},subvention:{term:`Programme public`,def:`Subvention, crédit d'impôt ou aide de l'État, accordé selon des critères et assorti de conditions (emplois, régions). Non respectées, il faut rembourser.`},major:{term:`Major`,def:`Géant international d'un secteur. Les majors proposent de racheter vos actifs ou filiales ; on négocie par rondes.`},amelioration:{term:`Amélioration`,def:`Service ajouté à un site existant (poste d'essence, loges, ligne automatisée, mur payant…). S'installe sur un site ou sur toute une chaîne.`}};function sp({id:e,children:t}){let n=op[e],r=(0,_.useId)(),[i,a]=(0,_.useState)(!1),[o,s]=(0,_.useState)(!1),[c,l]=(0,_.useState)(null),u=(0,_.useRef)(null),d=(0,_.useRef)(null);return(0,_.useLayoutEffect)(()=>{if(!i||!u.current)return;let e=u.current.getBoundingClientRect(),t=Math.min(288,window.innerWidth-16),n=Math.max(8,Math.min(e.left+e.width/2-t/2,window.innerWidth-t-8)),r=e.bottom+170>window.innerHeight&&e.top>180;l({left:n,top:r?e.top-8:e.bottom+8,above:r})},[i]),(0,_.useEffect)(()=>{if(!i)return;let e=()=>{a(!1),s(!1)},t=t=>t.key===`Escape`&&e(),n=t=>{let n=t.target;u.current?.contains(n)||d.current?.contains(n)||e()};return window.addEventListener(`keydown`,t),window.addEventListener(`pointerdown`,n),window.addEventListener(`scroll`,e,!0),()=>{window.removeEventListener(`keydown`,t),window.removeEventListener(`pointerdown`,n),window.removeEventListener(`scroll`,e,!0)}},[i]),(0,O.jsxs)(O.Fragment,{children:[(0,O.jsx)(`button`,{ref:u,type:`button`,"data-term":e,"aria-describedby":i?r:void 0,"aria-expanded":i,className:`cursor-help rounded-sm [letter-spacing:inherit] [
