reçus, actions vendues). C'est elle qui compte au classement.`},multiple:{term:`Multiple`,def:`Nombre d'années de BAIIA qu'un acheteur paie pour un actif. Un dépanneur se vend environ 1,8 fois son BAIIA annuel ; une plateforme de diffusion, plus de 4 fois.`},cote:{term:`Cote de crédit`,def:`De AAA (excellente) à CCC (risquée). Dépend surtout de la dette par rapport au BAIIA. Une meilleure cote abaisse le taux de vos emprunts.`},marge:{term:`Marge de crédit`,def:`Réserve d'argent à taux variable (taux directeur + 3,5 %). Tirée d'office si la trésorerie passe sous zéro.`},obligation:{term:`Obligation`,def:`Emprunt auprès des investisseurs : intérêts mensuels, capital remboursé d'un coup après 10 ans. Exige 20 M$ de valeur et une cote BBB ou mieux.`},pape:{term:`PAPE`,def:`Premier appel public à l'épargne : le holding (ou une filiale) entre en bourse en vendant de nouvelles actions au public. L'argent va à l'entreprise ; votre part est diluée.`},dilution:{term:`Dilution`,def:`Quand l'entreprise émet de nouvelles actions, votre pourcentage baisse. Sous 50 %, vous perdez la majorité et les activistes s'agitent.`},dividende:{term:`Dividende`,def:`Part du bénéfice net versée chaque mois aux actionnaires. Votre part va à votre fortune personnelle.`},opa:{term:`OPA`,def:`Offre publique d'achat : proposer à tous les actionnaires d'une société cotée de racheter leurs actions avec une prime. Hostile si la direction s'y oppose.`},diligence:{term:`Vérification diligente`,def:`Examen des livres avant un rachat (1 % du prix). Révèle les mauvaises surprises et fait souvent baisser le prix.`},integration:{term:`Intégration`,def:`Période après un rachat où l'actif rend 15 % de moins : systèmes, culture, syndicats. Plus longue pour les gros actifs et en cas de choc de culture.`},synergie:{term:`Synergie`,def:`Gain obtenu parce que deux activités du groupe s'entraident : publicité maison, approvisionnement interne, droits de diffusion, etc.`},filiale:{term:`Filiale`,def:`Société détenue par le holding. Chaque actif appartient à une filiale d'un domaine. Une filiale peut être vendue en bloc ou entrer en bourse.`},holding:{term:`Holding`,def:`Société mère qui détient les filiales. Vous en êtes l'actionnaire principal.`},minoritaires:{term:`Actionnaires minoritaires`,def:`Le public qui détient une partie d'une filiale cotée. Il touche sa part du bénéfice de cette filiale.`},saturation:{term:`Saturation`,def:`Plus vous possédez d'actifs d'un même type, moins chacun rapporte : les clients ne sont pas infinis.`},rampe:{term:`Montée en régime`,def:`Un actif neuf ouvre à 45 % de ses revenus et gagne environ 14 points par mois jusqu'au plein régime.`},taux:{term:`Taux directeur`,def:`Taux fixé par la Banque centrale. Il fait varier le coût de tous vos nouveaux emprunts et de la marge de crédit.`},reputation:{term:`Réputation`,def:`De 0 à 100. Aide à conclure les rachats et les OPA, améliore légèrement les ventes. Les scandales la font chuter.`},impot:{term:`Impôt`,def:`12,2 % sur les premiers 500 000 $ de bénéfice annuel (taux des PME), 26,5 % au-delà.`},flux:{term:`Flux de trésorerie`,def:`D'où vient l'argent et où il va : exploitation (activités), investissement (chantiers, rachats, ventes) et financement (emprunts, actions, dividendes).`},division:{term:`Division`,def:`Regroupement interne d'une filiale (ex. Division postes d'essence). Elle a son propre état des résultats ; une chaîne rachetée devient une division.`},marque:{term:`Marque`,def:`Nom commercial que vous créez et apposez sur vos actifs. Sa notoriété (0 à 100) augmente leurs ventes et parfois leurs marges ; on peut l'offrir sous licence.`},licence:{term:`Licence`,def:`D'autres entreprises paient chaque mois pour utiliser votre marque. Rentable, mais l'image s'use un peu plus vite.`},logistique:{term:`Capacité logistique`,def:`Vos magasins et pharmacies consomment des unités de logistique ; vos centres de distribution en fournissent. Au-delà, les coûts grimpent.`},placement:{term:`Placement privé`,def:`Vente d'actions du holding à des investisseurs privés, avant la bourse. Argent frais sans dette, en échange d'une dilution.`},complement:{term:`Complément de prix`,def:`Partie du prix de vente payée plus tard (ici 12 mois) si l'actif atteint ses cibles. Plus d'argent en tout, mais pas garanti.`},subvention:{term:`Programme public`,def:`Subvention, crédit d'impôt ou aide de l'État, accordé selon des critères et assorti de conditions (emplois, régions). Non respectées, il faut rembourser.`},major:{term:`Major`,def:`Géant international d'un secteur. Les majors proposent de racheter vos actifs ou filiales ; on négocie par rondes.`},amelioration:{term:`Amélioration`,def:`Service ajouté à un site existant (poste d'essence, loges, ligne automatisée, mur payant…). S'installe sur un site ou sur toute une chaîne.`},opahostile:{term:`OPA hostile`,def:`Offre d'achat lancée sans votre accord directement à vos actionnaires. Un raider ramasse d'abord vos actions en bourse. Sous 50 % des actions, vous pouvez perdre le contrôle ; au-dessus, il peut au mieux entrer au conseil.`},pilule:{term:`Pilule empoisonnée`,def:`Défense anti-OPA : les actionnaires (sauf le raider) peuvent acheter de nouvelles actions à rabais, ce qui dilue l'attaquant. Coûte des frais et fait reculer le titre. Protège 18 mois.`},chevalier:{term:`Chevalier blanc`,def:`Investisseur ami appelé à la rescousse pendant une OPA hostile : il achète un bloc de nouvelles actions, ce qui rend l'attaque beaucoup plus difficile.`},rachatactions:{term:`Rachat d'actions`,def:`Le holding rachète ses propres actions en bourse. Il y a moins d'actions dans le public, votre part monte et le raider a moins à ramasser.`},attentes:{term:`Attentes des analystes`,def:`BAIIA trimestriel que le marché prévoit pour vous (même trimestre l'an dernier, plus la croissance supposée, plus vos prévisions). Les battre fait monter le titre et la confiance du conseil ; les rater fait l'inverse.`},previsions:{term:`Prévisions (guidance)`,def:`Ce que vous annoncez au marché. Prudentes : attentes basses, faciles à battre. Ambitieuses : le titre se paie plus cher, mais il faut livrer.`},humeur:{term:`Humeur du marché`,def:`Écart entre le cours en bourse et la juste valeur (capitaux propres par action). Au-dessus de 100 %, le titre est cher ; en dessous, il est bon marché, les emprunts coûtent plus et les raiders rôdent.`},conseil:{term:`Conseil d'administration`,def:`Fixe trois objectifs par année. Sa confiance (0 à 100) monte avec les objectifs atteints et les bons trimestres. Satisfait, il accorde des moyens (taux réduit, crédit) ; déçu, il avertit, puis peut vous remplacer si le holding est coté.`},ere:{term:`Conjoncture`,def:`Grande période économique (croissance tranquille, ruée numérique, euphorie, krach, récession, stagflation, reprise, tourisme record) qui change la demande et la valeur de chaque secteur pendant un à trois ans.`},krach:{term:`Krach`,def:`Effondrement boursier : la valeur de tous les actifs plonge d'environ un tiers pendant quelques mois. Les fortunes fondent, puis remontent ; c'est aussi le moment des aubaines.`},guerreprix:{term:`Guerre de prix`,def:`Un rival casse ses prix ou ouvre des sites en face des vôtres : vos ventes du secteur baissent pendant quelques mois. Riposter coûte cher mais l'abrège ; un programme de fidélité limite les dégâts.`},encheres:{term:`Enchères`,def:`Les grosses chaînes se vendent aux enchères : les rivaux relancent chaque mois jusqu'à la clôture. Le plus offrant l'emporte et doit pouvoir payer.`},negociation:{term:`Négociation`,def:`Composez votre offre : comptant, actions du holding (s'il est coté), reprise de la dette du vendeur, ou une de vos filiales. La jauge d'intérêt montre si le vendeur signera ; « Quoi ajouter ? » vous dit ce qui manque.`},cadre:{term:`Cadre`,def:`Membre de la haute direction (finances, opérations, fusions, communications, affaires juridiques). Chacun a une compétence, un salaire et une loyauté ; mal payé, il démissionne ou se fait débaucher par un rival.`},tempsforts:{term:`Temps forts`,def:`Les grands moments de votre carrière (OPA, enchères, krach, classement, conseil), gardés dans le palmarès.`}};function $({id:e,children:t}){let n=Rm[e],r=(0,_.useId)(),[i,a]=(0,_.useState)(!1),[o,s]=(0,_.useState)(!1),[c,l]=(0,_.useState)(null),u=(0,_.useRef)(null),d=(0,_.useRef)(null);return(0,_.useLayoutEffect)(()=>{if(!i||!u.current)return;let e=u.current.getBoundingClientRect(),t=Math.min(288,window.innerWidth-16),n=Math.max(8,Math.min(e.left+e.width/2-t/2,window.innerWidth-t-8)),r=e.bottom+170>window.innerHeight&&e.top>180;l({left:n,top:r?e.top-8:e.bottom+8,above:r})},[i]),(0,_.useEffect)(()=>{if(!i)return;let e=()=>{a(!1),s(!1)},t=t=>t.key===`Escape`&&e(),n=t=>{let n=t.target;u.current?.contains(n)||d.current?.contains(n)||e()};return window.addEventListener(`keydown`,t),window.addEventListener(`pointerdown`,n),window.addEventListener(`scroll`,e,!0),()=>{window.removeEventListener(`keydown`,t),window.removeEventListener(`pointerdown`,n),window.removeEventListener(`scroll`,e,!0)}},[i]),(0,E.jsxs)(E.Fragment,{children:[(0,E.jsx)(`button`,{ref:u,type:`button`,"data-term":e,"aria-describedby":i?r:void 0,"aria-expanded":i,className:`cursor-help rounded-sm [letter-spacing:inherit] [text-transform:inherit] text-left underline decoration-gold/60 decoration-dotted underline-offset-2`,onMouseEnter:()=>a(!0),onMouseLeave:()=>!o&&a(!1),onFocus:()=>a(!0),onBlur:()=>!o&&a(!1),onClick:e=>{e.stopPropagation();let t=!o;s(t),a(t)},children:t??n.term}),i&&c?(0,E.jsxs)(`span`,{ref:d,id:r,role:`tooltip`,style:{position:`fixed`,left:c.left,top:c.top,width:Math.min(288,window.innerWidth-16),transform:c.above?`translateY(-100%)`:void 0},className:`z-[60] rounded-lg border border-gold/40 bg-surface-2 p-3 text-left text-xs leading-relaxed font-normal tracking-normal text-fg normal-case shadow-xl`,children:[(0,E.jsx)(`span`,{className:`block font-semibold text-gold`,children:n.term}),(0,E.jsx)(`span`,{className:`mt-1 text-muted`,children:e.def})]},e.term))})]})}var yh=[{title:`Votre bureau`,body:`Bienvenue à la tête de votre holding. Le Bureau résume le mois : résultats, conjoncture, dossiers à trancher et nouvelles. Il réunit aussi le Journal, vos Objectifs et le Classement des 500 grandes fortunes.`,targets:()=>[`bureau`],tab:()=>`bureau`},{title:`Les indicateurs`,body:`Trésorerie, BAIIA (ce que rapportent vos actifs), bénéfice net, valeur d'entreprise, fortune, dette et cote de crédit. Les mots soulignés ouvrent leur définition.`,targets:()=>[`indicateurs`]},{title:`Huit secteurs`,body:`Commerce, restauration, hôtellerie, divertissement, industrie, médias, pharma et services financiers : choisissez-en un avec les puces de couleur. Chacun a ses onglets Actifs (vos chaînes, une carte par bannière, avec actions sur tout le réseau), Construire, Améliorer, Services, Synergies et Concurrents (les grands groupes du secteur et leurs parts de marché). Les rachats sont tous réunis dans le Marché.`,targets:e=>[`tab-${e}-actifs`,`hub-secteurs`,`hubd-secteurs`],tab:e=>`${e}-actifs`},{title:`Construire`,body:`Choisissez le type de site, la ville (plus de 130, avec population et concurrence), la taille et le concept : kiosque ou méga-station, franchisé ou corporatif, propriétaire ou locataire, LEED… Les options avancées et les améliorations posées pendant le chantier (−15 %) sont repliées sous la fiche.`,targets:e=>[`tab-${e}-construire`],tab:e=>`${e}-construire`},{title:`Améliorer et Services`,body:`Améliorer : poste d'essence, terrasse, spa, ligne automatisée… Services : loterie, livraison, comptoir postal, navette, et combinaisons hôte-invité (un resto dans votre dépanneur, un café dans votre pharmacie). Sur un site ou toute une chaîne d'un coup.`,targets:e=>[`tab-${e}-services`],tab:e=>`${e}-services`},{title:`Le Marché`,body:`Tout ce qui s'achète est ici. À vendre : entreprises et chaînes de tous les secteurs (filtrez par domaine). Offrez le prix ou négociez un paquet : comptant, actions, dette reprise, une de vos filiales ; la jauge d'intérêt et « Quoi ajouter ? » vous guident. Les grosses chaînes passent aux Enchères.`,targets:()=>[`tab-marche`,`hub-marche`,`hubd-marche`],tab:()=>`marche`},{title:`Rivaux, OPA et défense`,body:`Huit PDG rivaux jouent contre vous : guerres de prix, surenchères, débauchage de cadres, ramassage de vos actions. Vous pouvez les racheter (OPA ou fusion négociée). Une fois en bourse, gardez plus de 50 % des actions : sinon une OPA hostile peut vous coûter votre groupe. Pilule empoisonnée, chevalier blanc et rachat d'actions sont dans Défense.`,targets:()=>[`tab-opa`,`hub-marche`,`hubd-marche`],tab:()=>`opa`},{title:`Marketing`,body:`Publicité : quatorze canaux (circulaires, radio, télé, réseaux sociaux, influenceurs, soldes…), une cible, un budget et une durée ; le rendement est mesuré. Marques, produits maison (près d'une centaine), exclusivités et commandites. Pas le temps ? Embauchez un directeur marketing : vous fixez budget et stratégie, il gère et vous fait rapport chaque mois.`,targets:()=>[`tab-publicite`,`hub-marketing`,`hubd-marketing`],tab:()=>`publicite`},{title:`Organigramme et partenariats`,body:`Groupe › Organigramme : holding, filiales, divisions et chaînes, que vous renommez quand vous voulez. Groupe › Partenariats : co-image de marque, distribution, franchise maîtresse, fidélisation ou coentreprise avec des firmes mondiales, conditions négociables.`,targets:()=>[`tab-organigramme`,`hub-groupe`,`hubd-groupe`],tab:()=>`organigramme`},{title:`Finance et bourse`,body:`Prêts, programmes publics, placement privé, entrée en bourse, dividendes et états financiers. Chaque trimestre, vos résultats sont comparés aux attentes des analystes : battez-les et le titre monte, ratez-les et vos taux grimpent et les raiders rôdent. Krachs et récessions font fondre les fortunes, puis la reprise revient.`,targets:()=>[`tab-bourse`,`hub-finance`,`hubd-finance`],tab:()=>`bourse`},{title:`Conseil, direction et classement`,bod
