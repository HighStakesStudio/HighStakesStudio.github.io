:`Certaines annonces de Grant sont des postures. Elles peuvent être levées à l'échéance — ou se transformer en vrais droits.`},aceum:{term:`ACEUM`,def:`Accord Canada–États-Unis–Mexique, révisé tous les trois ans (premier rendez-vous au mois 4). Cinq enjeux à trancher — céder, compromis ou tenir bon — selon votre rapport de force. Un accord augmente les échanges avec les É.-U. et baisse leurs tarifs.`},sauvegarde:{term:`Sauvegarde`,def:`La partie s'enregistre seule chaque mois. Le bouton « Sauvegarde » donne un code à copier ou un fichier à télécharger, pour reprendre la partie ailleurs.`},exception:{term:`Projets d'exception`,def:`Quinze projets de 0,8 à 6 G$, dans leur propre onglet (Pays › Exception), pour placer les gros surplus. Payés d'un coup par le solde et la Caisse, ils rapportent plus qu'ils ne coûtent une fois en service. Le Quotidien vous prévient dès que le premier devient abordable.`},inflation_outils:{term:`Outils contre l'inflation`,def:`Budget › Inflation : moteurs de l'inflation terme par terme, prévision à six mois et neuf mesures (Banque du Canada, gel de prix, TPS ciblée, subventions, logement, intrants, resserrement, obligations d'épargne). Les contre-tarifs font monter les prix.`},nord:{term:`Développement du Nord`,def:`Pays › Nord : treize investissements dans l'Arctique et les territoires, menés avec les partenaires autochtones. L'indice du Nord débloque des paliers (recettes, exportations, souveraineté, popularité).`},investissements_regionaux:{term:`Investissements régionaux`,def:`Régions : 54 projets répartis dans les 10 provinces et 3 territoires, de 5 à 50 M$, remboursés en deux ou trois ans, avec emplois et appui régional.`},grands_accords:{term:`Grands accords`,def:`Huit accords commerciaux (Commerce) au-delà des onze partenaires : nouvelles exportations, recettes au Trésor et moins de dépendance aux É.-U., avec des gagnants et des perdants.`},contenu:{term:`Contenu nord-américain`,def:`Part de la valeur produite en Amérique du Nord. Au-dessus du seuil, une exemption ACEUM prévue dans un décret s'applique.`},contretarifs:{term:`Contre-tarifs`,def:`Droits canadiens de rétorsion. Levier de négociation et signal politique, mais coût pour certaines chaînes et pour la relation avec Washington.`},dependance:{term:`Dépendance US`,def:`Part des ventes vers les États-Unis dans la production totale (exportations et marché intérieur). Touchez le chiffre du bandeau pour ouvrir Exportations et importations, où la part américaine des seules exportations est donnée à part. Objectif de résilience : sous ~45 %.`},popularite:{term:`Popularité`,def:`Cote du premier ministre. Détermine largement les chances de réélection. Emplois, commerce, provinces et déficit la font bouger.`},washington:{term:`Relation Washington`,def:`Climat bilatéral avec la Maison-Blanche et le Congrès. Une relation moins froide facilite reports, allègements et pourparlers ACEUM.`},provinces:{term:`Soutien provincial`,def:`Moyenne de l'appui des gouvernements provinciaux. Essentiel pour l'unité nationale et la stabilité politique.`},deficit:{term:`Déficit budgétaire`,def:`Solde fédéral cumulé. Recettes (impôts, taxe de vente, redevances) moins dépenses (programmes, transferts, assurance-emploi, intérêts). Un déficit est possible : quand l'économie cale, les recettes baissent.`},huard:{term:`Huard (CAD/USD)`,def:`Valeur du dollar canadien. Un huard faible amortit un peu les tarifs ; un huard fort pèse sur la compétitivité.`},pib:{term:`PIB`,def:`Indice d'activité économique nationale (100 = début de mandat). Les chocs tarifaires et les pertes d'exportations le font glisser.`},reserve:{term:`Écouler avant le décret`,def:`Quand un décret est annoncé, Ottawa paie la logistique (2 M$) pour que les exportateurs expédient avant l'entrée en vigueur : ventes américaines +6 % d'ici là, puis −3 % le temps d'écouler les stocks. Le gain va au secteur et à ses emplois, pas au Trésor. Une fois par décret.`},inflation:{term:`Inflation`,def:`Hausse annuelle des prix. Un huard faible, les contre-tarifs et la taxe de vente la font monter ; au-delà de 2,5 %, elle pèse sur la popularité.`},aide:{term:`Aide sectorielle`,def:`Package fédéral pour stabiliser emplois et production dans un secteur frappé. Coûteux pour le budget, populaire en région.`},decisions:{term:`Agenda du Cabinet`,def:`Aucune limite au nombre de décisions par mois. Les freins sont réels : coût budgétaire, plancher de crédit, délais (missions, négociations, lobbying), une seule ronde par partenaire et un seul message national par mois.`},saturation:{term:`Saturation médiatique`,def:`Les annonces du Cabinet rapportent au plus 4 points de popularité par mois (2 dans l'opposition), et de moins en moins à mesure que la cote monte. Les cartes du bureau ne sont pas plafonnées, mais leurs gains diminuent aussi quand la cote est haute.`},plancher_credit:{term:`Plancher de crédit`,def:`Sous un solde de −300 M$, le ministère des Finances bloque toute nouvelle dépense jusqu'au redressement des comptes.`},election:{term:`Élections`,def:`Un scrutin tous les cinq ans, jusqu'à vingt-cinq mandats. La part du vote dépend de la popularité, de l'économie, des promesses tenues et des débats ; les sièges suivent le vote. Le parti qui a le plus de sièges forme le gouvernement (majorité à 172 sur 343).`},midterms:{term:`Mi-mandat américain`,def:`Scrutin du Congrès à mi-chemin de chaque présidence. Si la Maison-Blanche perd la Chambre, les tarifs durs deviennent plus difficiles à maintenir.`},projet:{term:`Projet d'investissement`,def:`Chantier fédéral (port, usine, R&D…) qui crée des emplois, soutient une province et réduit la dépendance aux É.-U. à la mise en service.`},contretarif_produit:{term:`Contre-tarif produit`,def:`Droit canadien sur un produit US précis (bourbon, motos, tuyaux…) pour faire pression sur des districts électoraux — et sur Grant.`},pression_us:{term:`Pression des lobbies US`,def:`Plus elle monte, plus Grant risque de devoir alléger ses tarifs sous la pression de ses propres industriels.`},mission:{term:`Mission commerciale`,def:`Délégation vers l'Europe, le R.-U., le Mexique, le Japon ou la Corée pour ouvrir des débouchés hors É.-U.`},accord:{term:`Accord commercial`,def:`Filière en cinq étapes : exploration (missions), négociation (rondes), signature, ratification parlementaire, entrée en vigueur. En vigueur, il détourne progressivement des exportations des É.-U. vers le partenaire.`},concession:{term:`Concession`,def:`Accélère une négociation, mais ouvre un secteur sensible (gestion de l'offre, bœuf, automobile). Les lobbies et provinces touchés le font payer.`},ratification:{term:`Ratification`,def:`Adoption de l'accord signé par le Parlement (deux mois). Grant peut tenter de faire geler la mise en œuvre.`},sanctions:{term:`Sanctions économiques`,def:`Mesures de rétorsion ciblées (alcools, marchés publics, électricité, potasse, minéraux, pétrole). Elles font pression sur des États et lobbies américains, rapportent ou coûtent au budget, et peuvent provoquer l'escalade.`},influence:{term:`Influence à Washington`,def:`Capital politique canadien aux É.-U. (lobbyistes, gouverneurs, publicité). Améliore négociations et reports, réduit le risque de représailles ; s'érode chaque mois.`},lobby:{term:`Lobby intérieur`,def:`Groupe d'intérêt canadien (laitiers, agriculteurs, manufacturiers, ressources, syndicats, forestiers). Fâché, il pèse sur les sondages et sa province — et peut descendre dans la rue.`},gestion_offre:{term:`Gestion de l'offre`,def:`Système de quotas protégeant le lait, la volaille et les œufs. Ligne rouge politique au Québec et en Ontario dans toute négociation commerciale.`},developpement_regional:{term:`Développement régional`,def:`Programmes de douze mois des agences fédérales (APECA, DEC, FedDev, PrairiesCan, PacifiCan) : transition des travailleurs, diversification, innovation, infrastructures rurales.`},otan:{term:`Cible OTAN`,def:`Dépenses de défense exprimées en % du PIB. Sous 2 %, Grant accuse le Canada de « profiter » de l'alliance et lie défense et tarifs.`},approvisionnement:{term:`Approvisionnement de défense`,def:`Grands achats militaires (chasseurs, sous-marins, frégates, blindés). Le choix du fournisseur crée des emplois au pays et rapproche d'un allié ; annuler coûte des pénalités.`},haute_techno:{term:`Haute technologie et services`,def:`Programmes fédéraux par paliers (IA, semi-conducteurs, aérospatiale, biotech, fintech, numérique, ingénierie). Coût de lancement, puis coût mensuel ; production, emplois et exportations montent avec la maturité.`},consultation:{term:`Consultation autochtone et environnementale`,def:`Obligation de consulter les Premières Nations et d'évaluer l'impact environnemental avant un grand projet d'énergie. Issue : approbation, conditions (coûts, délais) ou blocage. Une participation au capital offerte aux communautés réduit fortement le risque.`},gnl:{term:`GNL`,def:`Gaz naturel liquéfié : refroidi à −162 °C pour être exporté par navire vers l'Europe et l'Asie, plutôt que par gazoduc vers les É.-U.`},societe_etat:{term:`Société d'État`,def:`Entreprise publique fédérale (à la manière des pétrolières publiques d'autrefois). Capital au départ, puis profits ou pertes chaque mois ; plus de contrôle et moins de dépendance aux É.-U., mais risques de mauvaise gestion et de scandale. Privatisable.`},renseignement:{term:`Renseignement`,def:`Service fictif inspiré du SCRS. Plus il est financé, plus ses lectures des menaces sont fiables. Chaque opération augmente l'exposition : au-delà d'un seuil, un scandale peut éclater.`},coentreprise:{term:`Coentreprise militaire`,def:`Développement et production d'équipements avec un allié (R.-U., Japon, Allemagne, Corée, Australie, France, Suède). Coûte au départ et chaque mois ; crée des emplois, des exportations et compte dans la cible OTAN.`},offre:{term:`Offre commerciale`,def:`Proposition spontanée d'un partenaire, souvent lui-même frappé par Grant : voie rapide de négociation, accès sectoriel ou co-investissement. Elle expire après quelques mois.`},marches:{term:`Marchés financiers`,def:`Devises et indices boursiers de douze économies, relevés chaque mois. Ils réagissent aux tarifs, décrets, accords, sanctions et crises. Noms d'indices en partie fictifs.`}};function Q({id:e,children:t}){let n=Jb[e],r=(0,_.useId)(),[i,a]=(0,_.useState)(!1),[o,s]=(0,_.useState)(!1),[c,l]=(0,_.useState)(null),u=(0,_.useRef)(null),d=(0,_.useRef)(null);return(0,_.useLayoutEffect)(()=>{if(!i||!u.current)return;let e=u.current.getBoundingClientRect(),t=Math.min(288,window.innerWidth-16),n=Math.max(8,Math.min(e.left+e.width/2-t/2,window.innerWidth-t-8)),r=e.bottom+170>window.innerHeight&&e.top>180;l({left:n,top:r?e.top-8:e.bottom+8,above:r})},[i]),(0,_.useEffect)(()=>{if(!i)return;let e=()=>{a(!1),s(!1)},t=t=>t.key===`Escape`&&e(),n=t=>{let n=t.target;u.current?.contains(n)||d.current?.contains(n)||e()};return window.addEventListener(`keydown`,t),window.addEventListener(`pointerdown`,n),window.addEventListener(`scroll`,e,!0),()=>{window.removeEventListener(`keydown`,t),window.removeEventListener(`pointerdown`,n),window.removeEventListener(`scroll`,e,!0)}},[i]),(0,C.jsxs)(C.Fragment,{children:[(0,C.jsx)(`button`,{ref:u,type:`button`,"data-term":e,"aria-describedby":i?r:void 0,"aria-expanded":i,className:`cursor-help rounded-sm text-left underline decoration-gold/60 decoration-dotted underline-offset-2`,onMouseEnter:()=>a(!0),onMouseLeave:()=>!o&&a(!1),onFocus:()=>a(!0),onBlur:()=>!o&&a(!1),onClick:e=>{e.stopPropagation();let t=!o;s(t),a(t)},children:t??n.term}),i&&c?(0,C.jsxs)(`span`,{ref:d,id:r,role:`tooltip`,style:{position:`fixed`,left:c.left,top:c.top,width:Math.min(288,window.innerWidth-16),transform:c.above?`translateY(-100%)`:void 0},className:`z-[60] rounded-lg border border-gold/40 bg-surface-2 p-3 text-left text-xs leading-relaxed font-normal tracking-normal text-fg normal-case shadow-xl`,children:[(0,C.jsx)(`span`,{className:`block font-semibold text-gold`,children:n.     <script>
      /* v3.1.3 : chien de garde sans React. Si l'appli n'a pas démarré en 6 s, écran de secours en HTML pur. */
      (function () {
        var KEY = "tarifs-save";
        function raw() {
          try { var a = localStorage.getItem(KEY); if (a) return a; } catch (e) {}
          try { var b = sessionStorage.getItem(KEY); if (b) return b; } catch (e) {}
          return null;
        }
        function hasName() { try { return String(window.name).indexOf("tarifs-WN1:") === 0; } catch (e) { return false; } }
        function go(mode) { location.href = location.pathname + "?secours=" + mode + "#/"; }
        setTimeout(function () {
          if (window.__appReady) return;
          var has = !!raw() || hasName();
          var b = "display:block;width:100%;min-height:48px;margin:8px 0;border-radius:10px;font:16px system-ui;cursor:pointer;";
          document.body.innerHTML =
            '<main data-boot-rescue="" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#0e1317;color:#f2ede4;font:16px system-ui;text-align:center">' +
            '<h1 style="font:600 24px Georgia,serif">Le démarrage tarde</h1>' +
            '<p style="max-width:360px;color:#aaa">' + (has ? "Votre partie est sur cet appareil. Reprenez-la." : "Aucune partie trouvée rapidement.") + "</p>" +
            '<div style="width:260px">' +
            (has ? '<button id="secours-continuer" style="' + b + 'background:#b3121b;color:#fff;border:0">Continuer la partie</button>' : "") +
            '<button id="secours-nouvelle" style="' + b + 'background:#fff;border:1px solid #ccc">Nouvelle partie</button>' +
            (raw() ? '<button id="secours-exporter" style="' + b + 'background:#fff;border:1px solid #ccc">Exporter la sauvegarde</button>' : "") +
            "</div></main>";
          var c = document.getElementById("secours-continuer"); if (c) c.onclick = function () { go("continuer"); };
          document.getElementById("secours-nouvelle").onclick = function () { go("nouvelle"); };
          var x = document.getElementById("secours-exporter");
          if (x) x.onclick = function () {
            var a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([raw()], { type: "application/json" }));
            a.download = "tarifs-sauvegarde.json"; document.body.appendChild(a); a.click();
          };
        }, 6000);
      })();
    </script>
  </body>
</html>
