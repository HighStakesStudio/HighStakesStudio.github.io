ssName:`mt-2 flex flex-wrap gap-2`,children:[(0,k.jsx)(q,{tone:`ember`,disabled:e.hq||n<4,onClick:()=>t(Co),"data-hq":``,children:`Établir le siège mondial`}),(0,k.jsx)(q,{disabled:!!e.ipo||n<4,onClick:()=>t(Jo),children:`Entrer en Bourse`})]})]})]})}var bl=[[`Ligne de production`,`Une chaîne qui fabrique un produit. Sa cadence dépend du niveau de machine (1-5), de l'automatisation (0-3), du nombre de quarts (1-3), du personnel, de l'état des machines, du moral et de l'expérience de la division. Une nouvelle ligne est en rodage 2 mois (65 %).`],[`Quart de travail`,`Un quart de plus double ou triple la production sans nouvelle machine, mais demande plus d'employés, use les machines plus vite et pèse sur le moral.`],[`Automatisation`,`Moins d'employés par quart (8 → 6 → 5 → 3) et cadence en hausse. Coûteux, mais rentable sur les lignes à 2-3 quarts.`],[`Demande vs capacité`,`La barre bleue est ce que vos usines peuvent produire ; le trait jaune ce que le marché et vos contrats réclament. Quand le jaune dépasse le bleu, vous laissez des ventes sur la table.`],[`Prix`,`100 % = prix de référence. Plus cher : meilleure marge mais la demande fond vite au-delà de 100 %. Moins cher : plus de volume.`],[`Distribution`,`Locale → régionale → nationale (Ventes › Marché). Chaque palier multiplie la demande pour votre marque.`],[`Contrat de distribution`,`Un détaillant achète votre marque à prix fixe chaque mois. Prix ~86-96 % du prix de référence ; le transport est à vos frais.`],[`Fabrication à forfait`,`Vous fabriquez la marque maison d'un détaillant (ex. « Le Choix du Présidant ») ou une pièce d'origine (OEM) pour un constructeur. Prix plus bas (~74-86 %), aucun frais de pub ni de transport, gros volumes, longue durée. Exigence de qualité minimale : sous la norme, une partie est refusée (défauts) et pénalisée.`],[`Exclusivité`,`Clause d'un contrat à forfait : +8 % de prix, mais la demande pour votre propre marque de ce produit baisse de 40 % pendant le contrat.`],[`Appel d'offres`,`Le client choisit le prix le plus bas. Une bonne réputation de fournisseur vous donne une petite marge. Perdu ? Le plancher approximatif est révélé.`],[`Renouvellement`,`À la fin d'un contrat bien livré, le client propose de renouveler, souvent à volume plus élevé. Vous pouvez renégocier (+6 %) : il peut accepter, refuser ou partir.`],[`Pénalités`,`Chaque unité en retard ou défectueuse coûte un pourcentage du prix (indiqué). Retards et défauts font baisser la réputation.`],[`Réputation`,`Fiabilité comme fournisseur (0-100). Elle grossit les offres et aide aux appels d'offres.`],[`Notoriété`,`Connaissance de votre marque (0-100) par division. La publicité la fait monter avec des rendements décroissants ; elle s'effrite de 3,5 % par mois.`],[`Élan (buzz)`,`Effet publicitaire ciblé sur un produit. Fort mais éphémère (−28 % par mois).`],[`Viral / flop`,`Chaque campagne a une petite chance d'exploser (×3) ou de tomber à plat (×0,2). Le web est le plus imprévisible.`],[`Salon professionnel`,`Média B2B : peu de notoriété grand public, mais plus d'offres de contrats et de réputation.`],[`Stock de sécurité`,`Matières achetées d'avance (en mois de production). Il protège des pénuries et des retards de fournisseurs, mais immobilise de l'argent.`],[`Modes de transport`,`Camion : souple ; train : moins cher, sensible aux grèves ; bateau : le moins cher outre-mer mais 1 mois de délai et les tempêtes ; avion : rapide, fiable, cher.`],[`Centre de distribution`,`Entrepôt régional : +60 000 unités, transport −20 % et livraisons plus fiables dans la région.`],[`Intégration verticale`,`Acheter un fournisseur (matière 15 % moins chère, jamais de pénurie) ou un transporteur (−25 %, pas de grèves).`],[`Étapes à l'étranger`,`Exportation → bureau de ventes → usine locale (pas de douane, transport court) → filiale (marque locale, +demande) → siège mondial.`],[`Droits de douane`,`Pourcentage prélevé sur les ventes exportées. Une usine dans la région ou une filiale les élimine.`],[`Synergies`,`Secteurs voisins (meubles-jouets-vêtements, électronique-autos) : nouvelle division plus expérimentée, R-D +20 %.`],[`Courbe d'apprentissage`,`Une division neuve produit à 70 % de sa cadence ; l'expérience monte chaque mois jusqu'à 100 %.`],[`Participation`,`Actions d'un rival. 20 % = siège au conseil (trêve des prix possible). Au-delà de 49 %, il faut une offre de prise de contrôle.`],[`Offre amicale / hostile`,`Amicale : +25 %, le conseil peut refuser. Hostile : +40 %, plus de chances mais un chevalier blanc peut surgir et faire grimper le prix de 15 %.`],[`Bureau de la concurrence`,`Examine les grosses transactions (3 mois). Il peut approuver, imposer des conditions (+6 % de coût) ou bloquer.`],[`Fusion ou filiale`,`Fusionner : l'entreprise devient une usine et renforce (ou crée) votre division. Filiale : elle garde sa marque et vous verse ses profits chaque mois.`],[`Raiders`,`Après l'entrée en Bourse, un rival peut accumuler vos actions. À 50 %, il vous remplace. Défenses : pilule empoisonnée, rachat d'actions, chevalier blanc.`],[`Faillite`,`Quatre mois de suite avec une caisse négative. Empruntez avant !`]];function xl(){return(0,k.jsxs)(K,{title:`Lexique`,children:[(0,k.jsx)(`dl`,{className:`flex flex-col gap-2 text-sm`,"data-lexique":!0,children:bl.map(([e,t])=>(0,k.jsxs)(`div`,{children:[(0,k.jsx)(`dt`,{className:`font-semibold text-ember`,children:e}),(0,k.jsx)(`dd`,{className:`text-fg/85`,children:t})]},e))}),(0,k.jsx)(`button`,{type:`button`,className:`mt-3 text-xs text-muted underline`,onClick:()=>G.getState().setTutorial(0),children:`Revoir le tutoriel`})]})}function Sl(){let{g:e,go:t}=cl(),n=G(e=>e.setPlant);return(0,k.jsxs)(`div`,{className:`flex flex-col gap-3`,"data-view":`apercu`,children:[(0,k.jsx)(K,{title:`Toutes les usines`,right:`${e.plants.length} usine(s) · ${e.plants.reduce((e,t)=>e+t.lines.length,0)} lignes`,children:(0,k.jsx)(`div`,{className:`flex flex-col gap-2`,children:e.plants.map(r=>{let i=r.lines.reduce((e,t)=>e+t.conditio
