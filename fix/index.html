  // PWA : service worker du dossier du jeu (portée distincte = application distincte).
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js", { scope: "./", updateViaCache: "none" }).then(function (r) { r.update().catch(function () {}); }).catch(function () {});
    });
    // Nouvelle version active : recharger une seule fois (la partie est déjà enregistrée), jamais en boucle.
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController) return;
      try { if (sessionStorage.getItem("hss-sw-reload")) return; sessionStorage.setItem("hss-sw-reload", "1"); } catch (e) { return; }
      location.reload();
    });
  }
  // Sauvegardes protégées contre le ménage automatique du navigateur.
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
</head>
  <body>
    <div id="app"></div>
    <script>
      /* v3.1.3 : chien de garde sans React. Si l'appli n'a pas démarré en 6 s, écran de secours en HTML pur. */
      (function () {
        var KEY = "fix-save";
        function raw() {
          try { var a = localStorage.getItem(KEY); if (a) return a; } catch (e) {}
          try { var b = sessionStorage.getItem(KEY); if (b) return b; } catch (e) {}
          return null;
        }
        function hasName() { try { return String(window.name).indexOf("fix-WN1:") === 0; } catch (e) { return false; } }
        function go(mode) { location.href = location.pathname + "?secours=" + mode + "#/"; }
        setTimeout(function () {
          if (window.__appReady) return;
          var has = !!raw() || hasName();
          var b = "display:block;width:100%;min-height:48px;margin:8px 0;border-radius:10px;font:16px system-ui;cursor:pointer;";
          document.body.innerHTML =
            '<main data-boot-rescue="" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#0d0718;color:#f2ede4;font:16px system-ui;text-align:center">' +
            '<h1 style="font:600 24px Georgia,serif">Le démarrage tarde</h1>' +
            '<p style="max-width:360px;color:#aaa">' + (has ? "Votre partie est sur cet appareil. Reprenez-la." : "Aucune partie trouvée rapidement.") + "</p>" +
            '<div style="width:260px">' +
            (has ? '<button id="secours-continuer" style="' + b + 'background:#ff2d95;color:#fff;border:0">Continuer la partie</button>' : "") +
            '<button id="secours-nouvelle" style="' + b + 'background:#fff;border:1px solid #ccc">Nouvelle partie</button>' +
            (raw() ? '<button id="secours-exporter" style="' + b + 'background:#fff;border:1px solid #ccc">Exporter la sauvegarde</button>' : "") +
            "</div></main>";
          var c = document.getElementById("secours-continuer"); if (c) c.onclick = function () { go("continuer"); };
          document.getElementById("secours-nouvelle").onclick = function () { go("nouvelle"); };
          var x = document.getElementById("secours-exporter");
          if (x) x.onclick = function () {
            var a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([raw()], { type: "application/json" }));
            a.download = "fix-sauvegarde.json"; document.body.appendChild(a); a.click();
          };
        }, 6000);
      })();
    </script>
  </body>
</html>
